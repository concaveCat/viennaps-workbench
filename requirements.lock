# Retained application stack for Python 3.12 on the legacy ViennaPS 4.6.2
# system-site-packages environment.
#
# ViennaPS 4.7.0 / ViennaLS 5.10.0 is the default runtime (see
# requirements-v470.lock). This file is kept so the 4.6.2 runtime can still be
# started for replay, for runs produced before the default switch, and for the
# capabilities the 4.7.0 binding does not provide: the patched multi-ion GPU
# build and the 2D Faraday cage etch.
#
# ViennaPS and ViennaLS are intentionally not application dependencies and must
# not be installed or upgraded from this file.

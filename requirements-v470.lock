# Default application stack: isolated ViennaPS 4.7.0 runtime (Python 3.12).
#
# This is the production lock. Install it into the Workbench venv:
#
#   python3.12 -m venv .venv
#   .venv/bin/python -m pip install -r requirements-v470.lock
#
# ViennaPS 4.7.0 metadata requires ViennaLS>=5.10.0; 5.10.0 is the version the
# migration probes and the Workbench test suite are exercised against.
#
# The ViennaPS 4.6.2 / ViennaLS 5.8.5 environment stays available under
# requirements.lock for replay, legacy runs and the two capabilities 4.7.0
# does not provide (patched multi-ion GPU, 2D Faraday cage etch). Old runs are
# never reinterpreted under a different runtime: they are rejected with the
# required/installed version pair instead.
